services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: toram-ledger-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-toram_ledger}
      POSTGRES_USER: ${POSTGRES_USER:-toram}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-toram_local_password}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - toram_postgres_data:/var/lib/postgresql/data
      - ./database:/database:ro
      - ./database/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  loader:
    build:
      context: .
      dockerfile: scripts/Dockerfile
    profiles:
      - tools
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-toram}:${POSTGRES_PASSWORD:-toram_local_password}@postgres:5432/${POSTGRES_DB:-toram_ledger}
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./data/raw:/app/data/raw:ro
      - ./data/processed:/app/data/processed
      - ./reports/validation:/app/reports/validation

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-toram}:${POSTGRES_PASSWORD:-toram_local_password}@postgres:5432/${POSTGRES_DB:-toram_ledger}
      LEDGER_REPOSITORY: postgres
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    volumes:
      - ./data/processed:/app/data/processed:ro
      - ./reports/validation:/app/reports/validation:ro

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    environment:
      API_BASE_URL: http://backend:8000
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8000}
    depends_on:
      - backend
    ports:
      - "${FRONTEND_PORT:-3000}:3000"

volumes:
  toram_postgres_data:
